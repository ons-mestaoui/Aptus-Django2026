<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Template HTML</title>
    <style>
        /* CSS de base pour la structure */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        nav { background: #444; color: white; padding: 0.5rem; text-align: center; }
        .container { display: flex; flex-wrap: wrap; padding: 1rem; }
        main { flex: 3; padding: 1rem; min-width: 300px; }
        aside { flex: 1; background: #f4f4f4; padding: 1rem; min-width: 200px; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; margin-top: auto; }
        
        /* Responsive : empiler les éléments sur petit écran */
        @media (max-width: 600px) {
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Mon Site Web</h1>
    </header>

    <nav>
        <a href="#" style="color:white; margin: 0 10px;">Accueil</a>
        <a href="#" style="color:white; margin: 0 10px;">Blog</a>
        <a href="#" style="color:white; margin: 0 10px;">Contact</a>
    </nav>

    <div class="container">
        <main>
            <h2>Titre de l'article</h2>
            <p>Contenu principal de la page...</p>
        </main>
        
        <aside>
            <h3>Sidebar</h3>
            <p>Liens ou informations supplémentaires.</p>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Mon Entreprise</p>
    </footer>

</body>
</html>
